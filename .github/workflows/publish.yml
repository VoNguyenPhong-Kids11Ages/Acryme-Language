name: Publish to PyPI

# Runs whenever you publish a GitHub Release, or you can trigger it
# manually from the Actions tab (Run workflow).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tool
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # This must match the "Environment name" you enter in PyPI's
    # trusted publisher form (leave both as "pypi", or change both
    # together).
    environment:
      name: pypi
      url: https://pypi.org/p/acryme
    permissions:
      id-token: write  # required for trusted publishing (OIDC) -- no token/password needed
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
